name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci

      # Les variables EXPO_PUBLIC_* sont inlinées dans le bundle au moment du
      # build : elles doivent exister avant le prebuild, pas au lancement.
      - name: Écrire le .env depuis les secrets
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > .env

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      # Le keystore est stocké encodé en base64 dans les secrets : un binaire ne
      # peut pas vivre dans un dépôt public, et surtout pas celui qui signe les
      # mises à jour de l'application.
      - name: Restaurer le keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/agrinafa.keystore
          cat >> android/gradle.properties <<'EOF'
          AGRINAFA_STORE_FILE=agrinafa.keystore
          EOF
          {
            echo "AGRINAFA_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "AGRINAFA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "AGRINAFA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties

      # Le prebuild signe la release avec la clé de debug. On y substitue la
      # vraie clé, et on échoue bruyamment si le motif attendu a bougé : un APK
      # de release signé en debug ne peut pas recevoir de mise à jour, et le
      # défaut ne se voit qu'une fois l'application distribuée.
      - name: Brancher la signature de release
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          chemin = pathlib.Path("android/app/build.gradle")
          gradle = chemin.read_text()

          signature = """
              release {
                  storeFile file(AGRINAFA_STORE_FILE)
                  storePassword AGRINAFA_STORE_PASSWORD
                  keyAlias AGRINAFA_KEY_ALIAS
                  keyPassword AGRINAFA_KEY_PASSWORD
              }
          """

          gradle, ajouts = re.subn(r"signingConfigs \{", "signingConfigs {" + signature, gradle, count=1)
          if ajouts != 1:
              sys.exit("Bloc signingConfigs introuvable dans build.gradle")

          # Cible le seul signingConfig du buildType release : celui de debug
          # doit continuer de pointer sur la clé de debug.
          gradle, bascules = re.subn(
              r"(buildTypes \{.*?release \{.*?)signingConfig signingConfigs\.debug",
              r"\1signingConfig signingConfigs.release",
              gradle,
              count=1,
              flags=re.S,
          )
          if bascules != 1:
              sys.exit("buildType release introuvable dans build.gradle")

          chemin.write_text(gradle)
          print("Signature de release branchée.")
          PY

      - name: Compiler l'APK de release
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: agrinafa-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
